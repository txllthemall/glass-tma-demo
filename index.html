<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Glass Delivery TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --glass-bg: rgba(255, 255, 255, 0.08);
      --glass-border: rgba(255, 255, 255, 0.18);
      --accent: #ff5e3a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at top left, #1e1b2e, #0d0b14 70%);
      color: #fff;
      min-height: 100vh;
      padding: 16px 16px 90px;
    }
    .header {
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .header h1 { font-size: 20px; font-weight: 700; }
    .header p { font-size: 13px; color: #aaa; margin-top: 4px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .card {
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease;
    }
    .card:active { transform: scale(0.97); }
    .emoji-img {
      font-size: 44px;
      text-align: center;
      padding: 14px 0;
      background: rgba(255,255,255,0.03);
      border-radius: 12px;
      margin-bottom: 10px;
    }
    .title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
    .desc { font-size: 11px; color: #999; margin-bottom: 10px; }
    .price-row { display: flex; justify-content: space-between; align-items: center; }
    .price { font-weight: 700; font-size: 15px; }
    .btn {
      background: var(--accent);
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
    }
    .cart-bar {
      position: fixed;
      bottom: 16px; left: 16px; right: 16px;
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      background: rgba(255, 94, 58, 0.85);
      border: 1px solid rgba(255,255,255,0.3);
      padding: 16px 20px;
      border-radius: 18px;
      display: none;
      justify-content: space-between;
      align-items: center;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(255, 94, 58, 0.4);
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>🔥 Street Food Glass</h1>
    <p>Доставка за 30 минут • 0% комиссии агрегаторов</p>
  </div>

  <div class="grid" id="catalog"></div>

  <div class="cart-bar" id="cartBar" onclick="checkout()">
    <span id="cartText">Корзина: 0 ₸</span>
    <span>Оформить →</span>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const items = [
      { id: 1, name: "Донер в лаваше 1.5x", desc: "Говядина, фирменный соус, фри", price: 2490, icon: "🌯" },
      { id: 2, name: "Смэш-бургер Дабл", desc: "Две котлеты, чеддер, халапеньо", price: 2890, icon: "🍔" },
      { id: 3, name: "Крылышки BBQ (8 шт)", desc: "Хрустящая корочка, соус ранч", price: 2190, icon: "🍗" },
      { id: 4, name: "Комбо На двоих", desc: "2 донера, 2 фри, 2 колы 0.5", price: 5490, icon: "🍟" }
    ];

    let cart = {};

    function render() {
      const container = document.getElementById('catalog');
      container.innerHTML = items.map(item => `
        <div class="card">
          <div>
            <div class="emoji-img">${item.icon}</div>
            <div class="title">${item.name}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="price-row">
            <span class="price">${item.price} ₸</span>
            <button class="btn" onclick="add(${item.id})">${cart[item.id] ? '+' + cart[item.id] : '+'}</button>
          </div>
        </div>
      `).join('');
      updateCart();
    }

    function add(id) {
      cart[id] = (cart[id] || 0) + 1;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      render();
    }

    function updateCart() {
      let total = 0;
      for (let id in cart) {
        const item = items.find(i => i.id == id);
        total += item.price * cart[id];
      }
      const bar = document.getElementById('cartBar');
      if (total > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartText').innerText = `Итого: ${total} ₸`;
      }
    }

    function checkout() {
      tg.sendData(JSON.stringify(cart));
      tg.showAlert("Заказ отправлен на кухню напрямую! Менеджер свяжется через 1 минуту.");
    }

    render();
  </script>
</body>
</html>
