<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Food Elite</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-base: #050508;
      --card-bg: rgba(255, 255, 255, 0.045);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-border-active: rgba(255, 94, 58, 0.6);
      --accent: #ff5e3a;
      --accent-gradient: linear-gradient(135deg, #ff5e3a 0%, #ff2a5f 100%);
      --text-main: #ffffff;
      --text-muted: #98989f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 20% 0%, rgba(255, 94, 58, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 80% 100%, rgba(120, 40, 180, 0.1) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 14px 110px;
      animation: pageIn 0.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    @keyframes pageIn {
      from { opacity: 0; transform: scale(0.96); }
      to { opacity: 1; transform: scale(1); }
    }

    .header {
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 22px; padding: 18px; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 15px 35px rgba(0,0,0,0.4);
    }
    .header h1 { font-size: 19px; font-weight: 700; letter-spacing: -0.4px; }
    .header p { font-size: 12px; color: var(--text-muted); margin-top: 3px; }
    
    .status-badge { 
      background: rgba(48, 209, 88, 0.12); color: #30d158; 
      border: 1px solid rgba(48, 209, 88, 0.25); font-size: 11px; font-weight: 600; 
      padding: 6px 12px; border-radius: 14px; display: flex; align-items: center; gap: 6px;
    }
    .status-badge::before { content: ''; width: 6px; height: 6px; background: #30d158; border-radius: 50%; box-shadow: 0 0 10px #30d158; }

    .cats { 
      display: flex; gap: 8px; overflow-x: auto; 
      padding: 6px 20px 10px 0; 
      margin-bottom: 16px; 
      scrollbar-width: none; 
    }
    .cats::-webkit-scrollbar { display: none; }
    
    .cat-btn {
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 10px 18px; border-radius: 16px; 
      font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .cat-btn:active { transform: scale(0.92); }
    .cat-btn.active { 
      background: var(--accent-gradient); color: #fff; 
      border-color: rgba(255,255,255,0.3); 
      box-shadow: 0 6px 20px rgba(255, 94, 58, 0.4);
      transform: translateY(-2px) scale(1.02);
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .card {
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:active { transform: scale(0.94); border-color: var(--card-border-active); }

    .food-img-wrap { width: 100%; height: 115px; border-radius: 14px; overflow: hidden; margin-bottom: 9px; background: #121216; position: relative; }
    .food-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1); }
    .card:hover .food-img { transform: scale(1.08); }

    .title { font-size: 13.5px; font-weight: 700; margin-bottom: 3px; line-height: 1.25; letter-spacing: -0.2px; }
    .desc { font-size: 10.5px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; }
    .price { font-weight: 800; font-size: 14.5px; letter-spacing: -0.3px; }
    
    /* Жестко центрированный счетчик */
    .counter { 
      display: flex; align-items: center; justify-content: center; gap: 4px; 
      background: rgba(255,255,255,0.07); border-radius: 12px; padding: 2px; 
      border: 1px solid rgba(255,255,255,0.1); height: 32px; 
    }
    .btn { 
      background: var(--accent-gradient); border: none; color: #fff; 
      width: 28px; height: 28px; border-radius: 10px; font-weight: 700; 
      font-size: 15px; cursor: pointer; display: flex; align-items: center; 
      justify-content: center; box-shadow: 0 4px 12px rgba(255,94,58,0.4); 
      transition: transform 0.15s cubic-bezier(0.34, 1.56, 0.64, 1); 
    }
    .btn:active { transform: scale(0.75); }
    .btn.minus { background: transparent; box-shadow: none; color: var(--text-main); }
    .qty { 
      font-size: 13px; font-weight: 700; width: 22px; height: 100%;
      display: flex; align-items: center; justify-content: center; 
      text-align: center; line-height: 1;
    }

    .cart-bar {
      position: fixed; bottom: 16px; left: 14px; right: 14px;
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      background: linear-gradient(135deg, rgba(255, 94, 58, 0.95), rgba(255, 42, 95, 0.95)); 
      border: 1px solid rgba(255,255,255,0.35);
      padding: 16px 20px; border-radius: 20px; display: none; justify-content: space-between; align-items: center;
      font-weight: 700; box-shadow: 0 16px 40px rgba(255, 94, 58, 0.5); cursor: pointer; z-index: 10;
    }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      display: none; align-items: flex-end; z-index: 20;
    }

    .modal {
      width: 100%; background: #0d0d12; border-top: 1px solid rgba(255,255,255,0.12);
      border-radius: 28px 28px 0 0; padding: 26px 18px 40px;
      box-shadow: 0 -25px 60px rgba(0,0,0,0.9);
      max-height: 90vh; overflow-y: auto;
    }

    .modal h2 { font-size: 20px; margin-bottom: 8px; font-weight: 700; letter-spacing: -0.3px; }
    .modal-img { width: 100%; height: 200px; object-fit: cover; border-radius: 18px; margin-bottom: 16px; background: #14141a; }
    .modal-desc { font-size: 13px; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    .modal-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .modal-price { font-size: 20px; font-weight: 800; }
    
    .input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.09);
      color: #fff; padding: 14px 16px; border-radius: 16px; margin-bottom: 11px; font-size: 14px; outline: none;
      transition: all 0.25s ease;
    }
    .input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); box-shadow: 0 0 20px rgba(255,94,58,0.2); }

    .submit-btn {
      width: 100%; background: var(--accent-gradient); color: #fff; border: none;
      padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 700; margin-top: 6px; cursor: pointer;
      box-shadow: 0 10px 30px rgba(241, 70, 53, 0.45); transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .submit-btn:active { transform: scale(0.96); }
    .close-btn { color: var(--text-muted); text-align: center; margin-top: 14px; font-size: 13px; cursor: pointer; font-weight: 500; transition: color 0.2s; }
    .close-btn:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🔥 Street Food Elite</h1>
      <p>Премиум доставка • Алматы</p>
    </div>
    <div class="status-badge">Открыто</div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="grid" id="catalog"></div>

  <div class="cart-bar" id="cartBar" onclick="openCheckoutModal()">
    <span id="cartText">Корзина: 0 ₸</span>
    <span>Оформить заказ →</span>
  </div>

  <!-- Модальное окно товара -->
  <div class="modal-bg" id="itemModalBg" onclick="closeItemModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <div id="itemModalContent"></div>
    </div>
  </div>

  <!-- Модальное окно заказа -->
  <div class="modal-bg" id="checkoutModalBg" onclick="closeCheckoutModal()">
    <div class="modal" onclick="event.stopPropagation()">
      <h2>Оформление заказа</h2>
      <input class="input" id="userName" placeholder="Ваше имя">
      <input class="input" id="userPhone" type="tel" placeholder="Телефон для Kaspi Gold">
      <input class="input" id="userAddr" placeholder="Адрес доставки (улица, дом, кв)">
      <button class="submit-btn" onclick="sendOrder()">🔴 Оплатить через Kaspi.kz</button>
      <div class="close-btn" onclick="closeCheckoutModal()">Вернуться к меню</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const OWNER_WHATSAPP = "77001234567"; 

    const items = [
      { 
        id: 1, cat: "Донеры", name: "Донер Говядина 1.5x", 
        desc: "Мраморная говядина, картофель фри, фирменный секретный соус", 
        fullDesc: "👑 Флагманский сочный донер повышенного объема. Состав: нежнейшая мраморная говядина обжаренная на вертеле, хрустящий картофель фри, фирменный чесночно-белый соус, свежие томаты и хрустящий салат айсберг в тонком армянском лаваше. Вес: 480 г.", 
        price: 2490, img: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=500&q=80" 
      },
      { 
        id: 2, cat: "Бургеры", name: "Смэш-бургер Дабл", 
        desc: "Две сочные котлеты, двойной чеддер, острый халапеньо", 
        fullDesc: "🍔 Двойной удар по голоду. Состав: две фирменные говяжьи смэш-котлеты с хрустящей корочкой, двойной расплавленный сыр чеддер, пикантные кольца халапеньо, маринованные огурчики, фирменный соус в обжаренной булочке бриошь. Вес: 390 г.", 
        price: 2890, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80" 
      },
      { 
        id: 3, cat: "Закуски", name: "Крылышки BBQ (8 шт)", 
        desc: "Хрустящая корочка в глазури BBQ, соус ранч", 
        fullDesc: "🔥 Куриные крылышки высшей категории в хрустящей панировке, щедро глазированные в фирменном дымном соусе BBQ. Подаются с прохладным соусом ранч и стеблями сельдерея. Порция: 8 штук (320 г).", 
        price: 2190, img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=500&q=80" 
      },
      { 
        id: 4, cat: "Комбо", name: "Комбо На двоих", 
        desc: "2 фирменных донера, 2 порции фри, 2 колы 0.5л", 
        fullDesc: "🎉 Идеальный сет для компании или плотного обеда вдвоем. В наборе: 2 классических донера с курицей/говядиной на выбор, две большие порции хрустящего картофеля фри с соусом на выбор и две бутылочки Coca-Cola 0.5 л.", 
        price: 5490, img: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=500&q=80" 
      },
      { 
        id: 5, cat: "Бургеры", name: "Трюфельный Чизбургер", 
        desc: "Булочка бриошь, трюфельный айоли, луковый конфитюр", 
        fullDesc: "💎 Премиальный бургер для истинно искушенных. Состав: мраморная говядина, ароматный трюфельный майонез (айоли), карамелизированный луковый конфитюр, сыр моцарелла и швейцарский сыр в мягкой булочке бриошь. Вес: 350 г.", 
        price: 3190, img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500&q=80" 
      },
      { 
        id: 6, cat: "Донеры", name: "Сырный Донер Микс", 
        desc: "Курица и говядина под расплавленным чеддером", 
        fullDesc: "🧀 Мощный сырный взрыв. Состав: микс нежного куриного филе и сочной говядины, обильно залитый горячим тягучим сырным соусом чеддер, со свежими овощами в хрустящем лаваше. Вес: 460 г.", 
        price: 2690, img: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=500&q=80" 
      }
    ];

    const categories = ["Все", "Донеры", "Бургеры", "Комбо", "Закуски"];
    let activeCat = "Все";
    let cart = {};

    function renderCats() {
      document.getElementById('cats').innerHTML = categories.map(c => 
        `<button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
      ).join('');
    }

    function setCat(c) {
      activeCat = c;
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      renderCats();
      renderCatalog();
    }

    function renderCatalog() {
      const filtered = activeCat === "Все" ? items : items.filter(i => i.cat === activeCat);
      document.getElementById('catalog').innerHTML = filtered.map(item => {
        const q = cart[item.id] || 0;
        return `
        <div class="card" data-item-id="${item.id}" onclick="openItemModal(${item.id})">
          <div>
            <div class="food-img-wrap">
              <img class="food-img" src="${item.img}" loading="lazy">
            </div>
            <div class="title">${item.name}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="price-row" onclick="event.stopPropagation()">
            <span class="price">${item.price} ₸</span>
            <div class="counter-wrap" id="counter-${item.id}">
              ${getCounterHTML(item.id, q)}
            </div>
          </div>
        </div>`;
      }).join('');
      updateCart();
    }

    function getCounterHTML(id, q) {
      if (q === 0) {
        return `<button class="btn" onclick="mod(${id}, 1)">+</button>`;
      } else {
        return `
          <div class="counter">
            <button class="btn minus" onclick="mod(${id}, -1)">−</button>
            <span class="qty">${q}</span>
            <button class="btn" onclick="mod(${id}, 1)">+</button>
          </div>
        `;
      }
    }

    function updateCardNode(id) {
      const item = items.find(i => i.id == id);
      if (!item) return;
      const q = cart[id] || 0;
      const counterWrap = document.getElementById(`counter-${id}`);
      if (counterWrap) {
        counterWrap.innerHTML = getCounterHTML(id, q);
      }
      
      // Если открыта модалка этого товара, тоже обновляем в ней счетчик
      const modalContent = document.getElementById('itemModalContent');
      if (modalContent && modalContent.dataset.itemId == id) {
        const modalFooter = modalContent.querySelector('.modal-footer-right');
        if (modalFooter) {
          modalFooter.innerHTML = getCounterHTML(id, q);
        }
      }
    }

    function openItemModal(id) {
      const item = items.find(i => i.id == id);
      if (!item) return;
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');

      const q = cart[item.id] || 0;
      document.getElementById('itemModalContent').dataset.itemId = item.id;
      document.getElementById('itemModalContent').innerHTML = `
        <img class="modal-img" src="${item.img}">
        <h2>${item.name}</h2>
        <div class="modal-desc">${item.fullDesc}</div>
        <div class="modal-footer">
          <span class="modal-price">${item.price} ₸</span>
          <div class="modal-footer-right">
            ${getCounterHTML(item.id, q)}
          </div>
        </div>
        <div class="close-btn" onclick="closeItemModal()">Закрыть</div>
      `;
      document.getElementById('itemModalBg').style.display = 'flex';
    }

    function closeItemModal() {
      document.getElementById('itemModalBg').style.display = 'none';
    }

    function mod(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      
      // Точечное обновление без перерисовки всего каталога и без миганий!
      updateCardNode(id);
      updateCart();
    }

    function getTotal() {
      let total = 0;
      for (let id in cart) {
        const item = items.find(i => i.id == id);
        if (item) total += item.price * cart[id];
      }
      return total;
    }

    function updateCart() {
      const total = getTotal();
      const bar = document.getElementById('cartBar');
      if (total > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartText').innerText = `Итого: ${total} ₸`;
      } else {
        bar.style.display = 'none';
      }
    }

    function openCheckoutModal() {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      document.getElementById('checkoutModalBg').style.display = 'flex';
    }

    function closeCheckoutModal() {
      document.getElementById('checkoutModalBg').style.display = 'none';
    }

    function sendOrder() {
      const name = document.getElementById('userName').value.trim() || "Клиент";
      const phone = document.getElementById('userPhone').value.trim();
      const addr = document.getElementById('userAddr').value.trim();
      if (!phone || !addr) {
        tg.showAlert("Укажите телефон и адрес для оформления заказа!");
        return;
      }
      let lines = [`🔥 *ЗАКАЗ ИЗ МИНИ-ПРИЛОЖЕНИЯ*`];
      for (let id in cart) {
        const item = items.find(i => i.id == id);
        lines.push(`• ${item.name} x${cart[id]} = ${item.price * cart[id]} ₸`);
      }
      lines.push(`\n💰 *Сумма:* ${getTotal()} ₸`);
      lines.push(`👤 *Имя:* ${name}`);
      lines.push(`📱 *Телефон:* ${phone}`);
      lines.push(`📍 *Адрес:* ${addr}`);

      const text = encodeURIComponent(lines.join('\n'));
      tg.openLink(`https://wa.me/${OWNER_WHATSAPP}?text=${text}`);
    }

    renderCats();
    renderCatalog();
  </script>
</body>
</html>
