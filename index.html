<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Street Food Luxury</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #09090e;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-active: rgba(255, 94, 58, 0.4);
      --accent: #ff5e3a;
      --accent-gradient: linear-gradient(135deg, #ff5e3a 0%, #ff2a5f 100%);
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(255, 94, 58, 0.12) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(43, 29, 56, 0.4) 0%, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 16px 14px 110px;
      animation: fadeInPage 0.5s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes fadeInPage {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .header {
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 24px; padding: 18px; margin-bottom: 16px;
      display: flex; justify-content: space-between; align-items: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }
    .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.4px; }
    .header p { font-size: 12px; color: var(--text-muted); margin-top: 4px; }
    
    .badge { 
      background: rgba(34, 197, 94, 0.1); color: #22c55e; 
      border: 1px solid rgba(34, 197, 94, 0.2); font-size: 11px; font-weight: 600; 
      padding: 6px 12px; border-radius: 14px; display: flex; align-items: center; gap: 6px;
    }
    .badge::before { content: ''; width: 6px; height: 6px; background: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }

    .cats { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 14px; scrollbar-width: none; }
    .cats::-webkit-scrollbar { display: none; }
    
    .cat-btn {
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      background: var(--card-bg); border: 1px solid var(--card-border);
      color: var(--text-muted); padding: 9px 18px; border-radius: 16px; 
      font-size: 13px; font-weight: 600; white-space: nowrap; cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .cat-btn.active { 
      background: var(--accent-gradient); color: #fff; 
      border-color: rgba(255,255,255,0.2); 
      box-shadow: 0 8px 20px rgba(255,94,58,0.35);
      transform: translateY(-1px);
    }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    
    .card {
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      background: var(--card-bg); border: 1px solid var(--card-border);
      border-radius: 22px; padding: 10px; display: flex; flex-direction: column; justify-content: space-between;
      animation: cardAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) backwards;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
    }
    .card:active { transform: scale(0.97); }
    
    @keyframes cardAppear {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    .card:nth-child(1) { animation-delay: 0.05s; }
    .card:nth-child(2) { animation-delay: 0.1s; }
    .card:nth-child(3) { animation-delay: 0.15s; }
    .card:nth-child(4) { animation-delay: 0.2s; }
    .card:nth-child(5) { animation-delay: 0.25s; }
    .card:nth-child(6) { animation-delay: 0.3s; }

    .food-img-wrap { width: 100%; height: 110px; border-radius: 16px; overflow: hidden; margin-bottom: 8px; background: #13131a; position: relative; }
    .food-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.4s ease; }
    .card:hover .food-img { transform: scale(1.05); }

    .title { font-size: 13px; font-weight: 700; margin-bottom: 3px; line-height: 1.25; letter-spacing: -0.2px; }
    .desc { font-size: 10px; color: var(--text-muted); margin-bottom: 10px; line-height: 1.35; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .price-row { display: flex; justify-content: space-between; align-items: center; margin-top: auto; padding-top: 4px; }
    .price { font-weight: 800; font-size: 14px; letter-spacing: -0.3px; }
    
    .counter { display: flex; align-items: center; gap: 4px; background: rgba(255,255,255,0.08); border-radius: 12px; padding: 2px; border: 1px solid rgba(255,255,255,0.05); }
    .btn { background: var(--accent-gradient); border: none; color: #fff; width: 28px; height: 28px; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(255,94,58,0.3); transition: transform 0.1s ease; }
    .btn:active { transform: scale(0.9); }
    .btn.minus { background: transparent; box-shadow: none; color: var(--text-main); }
    .qty { font-size: 12px; font-weight: 700; min-width: 14px; text-align: center; }

    .cart-bar {
      position: fixed; bottom: 16px; left: 14px; right: 14px;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
      background: linear-gradient(135deg, rgba(255, 94, 58, 0.95), rgba(255, 42, 95, 0.95)); 
      border: 1px solid rgba(255,255,255,0.25);
      padding: 16px 20px; border-radius: 20px; display: none; justify-content: space-between; align-items: center;
      font-weight: 700; box-shadow: 0 16px 35px rgba(255, 94, 58, 0.45); cursor: pointer; z-index: 10;
      animation: bounceUp 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes bounceUp {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .modal-bg {
      position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: none; align-items: flex-end; z-index: 20;
      animation: fadeIn 0.2s ease;
    }
    
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .modal {
      width: 100%; background: #121218; border-top: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px 28px 0 0; padding: 24px 18px 36px;
      box-shadow: 0 -20px 50px rgba(0,0,0,0.8);
      animation: slideUpModal 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes slideUpModal {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .modal h2 { font-size: 18px; margin-bottom: 16px; font-weight: 700; letter-spacing: -0.3px; }
    
    .input {
      width: 100%; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.08);
      color: #fff; padding: 14px 16px; border-radius: 16px; margin-bottom: 10px; font-size: 14px; outline: none;
      transition: border-color 0.2s ease, background 0.2s ease;
    }
    .input:focus { border-color: var(--accent); background: rgba(255,255,255,0.08); }

    .submit-btn {
      width: 100%; background: #f14635; color: #fff; border: none;
      padding: 16px; border-radius: 16px; font-size: 15px; font-weight: 700; margin-top: 6px; cursor: pointer;
      box-shadow: 0 8px 25px rgba(241, 70, 53, 0.4); transition: transform 0.15s ease;
    }
    .submit-btn:active { transform: scale(0.98); }
    .close-btn { color: var(--text-muted); text-align: center; margin-top: 14px; font-size: 13px; cursor: pointer; font-weight: 500; }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>🔥 Street Food Luxury</h1>
      <p>Безупречная доставка • Алматы</p>
    </div>
    <div class="badge">Работаем</div>
  </div>

  <div class="cats" id="cats"></div>
  <div class="grid" id="catalog"></div>

  <div class="cart-bar" id="cartBar" onclick="openModal()">
    <span id="cartText">Корзина: 0 ₸</span>
    <span>Оформить заказ →</span>
  </div>

  <div class="modal-bg" id="modalBg">
    <div class="modal">
      <h2>Быстрое оформление</h2>
      <input class="input" id="userName" placeholder="Ваше имя">
      <input class="input" id="userPhone" type="tel" placeholder="Телефон для Kaspi Gold">
      <input class="input" id="userAddr" placeholder="Адрес доставки (улица, дом, кв)">
      <button class="submit-btn" onclick="sendOrder()">🔴 Оплатить через Kaspi.kz</button>
      <div class="close-btn" onclick="closeModal()">Вернуться к меню</div>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const OWNER_WHATSAPP = "77001234567"; 

    const items = [
      { id: 1, cat: "Донеры", name: "Донер Говядина 1.5x", desc: "Мраморная говядина, хрустящий картофель фри, фирменный соус", price: 2490, img: "https://images.unsplash.com/photo-1529006557810-274b9b2fc783?w=500&q=80" },
      { id: 2, cat: "Бургеры", name: "Смэш-бургер Дабл", desc: "Две сочные котлеты, двойной чеддер, маринованный халапеньо", price: 2890, img: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&q=80" },
      { id: 3, cat: "Закуски", name: "Крылышки BBQ (8 шт)", desc: "Хрустящая корочка в глазури BBQ, нежный соус ранч", price: 2190, img: "https://images.unsplash.com/photo-1567620832903-9fc6debc209f?w=500&q=80" },
      { id: 4, cat: "Комбо", name: "Комбо На двоих", desc: "2 фирменных донера, 2 порции фри, 2 колы 0.5л", price: 5490, img: "https://images.unsplash.com/photo-1561758033-d89a9ad46330?w=500&q=80" },
      { id: 5, cat: "Бургеры", name: "Трюфельный Чизбургер", desc: "Бриошь, трюфельный айоли, карамелизированный лук", price: 3190, img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=500&q=80" },
      { id: 6, cat: "Донеры", name: "Сырный Донер Микс", desc: "Курица и говядина под расплавленным соусом чеддер", price: 2690, img: "https://images.unsplash.com/photo-1626700051175-6818013e1d4f?w=500&q=80" }
    ];

    const categories = ["Все", "Донеры", "Бургеры", "Комбо", "Закуски"];
    let activeCat = "Все";
    let cart = {};

    function renderCats() {
      document.getElementById('cats').innerHTML = categories.map(c => 
        `<button class="cat-btn ${c === activeCat ? 'active' : ''}" onclick="setCat('${c}')">${c}</button>`
      ).join('');
    }

    function setCat(c) {
      activeCat = c;
      if (tg.HapticFeedback) tg.HapticFeedback.selectionChanged();
      renderCats();
      renderCatalog();
    }

    function renderCatalog() {
      const filtered = activeCat === "Все" ? items : items.filter(i => i.cat === activeCat);
      document.getElementById('catalog').innerHTML = filtered.map(item => {
        const q = cart[item.id] || 0;
        return `
        <div class="card">
          <div>
            <div class="food-img-wrap">
              <img class="food-img" src="${item.img}" loading="lazy">
            </div>
            <div class="title">${item.name}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="price-row">
            <span class="price">${item.price} ₸</span>
            ${q === 0 ? 
              `<button class="btn" onclick="mod(${item.id}, 1)">+</button>` :
              `<div class="counter">
                <button class="btn minus" onclick="mod(${item.id}, -1)">−</button>
                <span class="qty">${q}</span>
                <button class="btn" onclick="mod(${item.id}, 1)">+</button>
              </div>`
            }
          </div>
        </div>`;
      }).join('');
      updateCart();
    }

    function mod(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('light');
      renderCatalog();
    }

    function getTotal() {
      let total = 0;
      for (let id in cart) {
        const item = items.find(i => i.id == id);
        if (item) total += item.price * cart[id];
      }
      return total;
    }

    function updateCart() {
      const total = getTotal();
      const bar = document.getElementById('cartBar');
      if (total > 0) {
        bar.style.display = 'flex';
        document.getElementById('cartText').innerText = `Итого: ${total} ₸`;
      } else {
        bar.style.display = 'none';
      }
    }

    function openModal() {
      if (tg.HapticFeedback) tg.HapticFeedback.impactOccurred('medium');
      document.getElementById('modalBg').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('modalBg').style.display = 'none';
    }

    function sendOrder() {
      const name = document.getElementById('userName').value.trim() || "Клиент";
      const phone = document.getElementById('userPhone').value.trim();
      const addr = document.getElementById('userAddr').value.trim();
      if (!phone || !addr) {
        tg.showAlert("Укажите телефон и адрес для оформления заказа!");
        return;
      }
      let lines = [`🔥 *ЗАКАЗ ИЗ МИНИ-ПРИЛОЖЕНИЯ*`];
      for (let id in cart) {
        const item = items.find(i => i.id == id);
        lines.push(`• ${item.name} x${cart[id]} = ${item.price * cart[id]} ₸`);
      }
      lines.push(`\n💰 *Сумма:* ${getTotal()} ₸`);
      lines.push(`👤 *Имя:* ${name}`);
      lines.push(`📱 *Телефон:* ${phone}`);
      lines.push(`📍 *Адрес:* ${addr}`);

      const text = encodeURIComponent(lines.join('\n'));
      tg.openLink(`https://wa.me/${OWNER_WHATSAPP}?text=${text}`);
    }

    renderCats();
    renderCatalog();
  </script>
</body>
</html>
